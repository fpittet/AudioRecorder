name: SonarCloud Analysis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  sonarcloud:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nécessaire pour l'analyse SonarCloud (historique complet)

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: |
          dotnet restore AudioRecorder.csproj
          dotnet restore ../AudioRecorder.Tests/AudioRecorder.Tests.csproj

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin `
            /k:"fpittet_AudioRecorder" `
            /o:"fpittet" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.exclusions="**/obj/**,**/bin/**"

      - name: Build
        run: |
          dotnet build AudioRecorder.csproj --no-restore
          dotnet build ../AudioRecorder.Tests/AudioRecorder.Tests.csproj --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test ../AudioRecorder.Tests/AudioRecorder.Tests.csproj `
            --no-build `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
